<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Inventario</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .contenedor {
            width: 90%;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .barra-superior {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .busqueda {
            flex-grow: 1;
            text-align: center;
        }

        .barra-global {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: var(--primary-color, #256eb) !important;
            color: var(--primary-color-text, #ffffff) !important;
        }

        .texto-sesion {
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</h:head>

<h:body styleClass="ui-widget-content" style="border: none;">

    <div class="contenedor ui-widget-content">

        <h:form id="formInventario">

            <p:growl id="growl" showDetail="true" life="3000"/>

            <!-- Cabecera principal heredando el color del tema -->
            <div class="barra-global ui-widget-header">
                <div style="display: flex; gap: 10px; align-items: center;">

                    <!-- Botones con clases nativas de PrimeFaces -->
                    <p:commandButton value="Cerrar sesión"
                                     action="#{loginUI.logout}"
                                     immediate="true"
                                     ajax="false"
                                     styleClass="ui-button-danger"
                                     icon="pi pi-sign-out"/>

                    <p:commandButton id="btnConfig"
                                     icon="pi pi-cog"
                                     type="button"
                                     styleClass="ui-button-flat"
                                     style="color: inherit"
                                     title="Configuracion Visual"/>

                    <p:overlayPanel for="btnConfig" style="width: 250px; padding: 10px;">
                        <h:outputText value="Tema de la interfaz" style="font-weight: bold; display: block; margin-bottom: 10px;"/>
                        <p:selectOneMenu id="selectorTema" value="#{temaBean.temaActual}" style="width: 100%;">
                            <f:selectItem itemLabel="Por defecto (Claro)" itemValue="saga" />
                            <f:selectItem itemLabel="Oscuro Moderno" itemValue="arya" />
                            <f:selectItem itemLabel="Oscuro (Verde)" itemValue="luna-green" />
                            <f:selectItem itemLabel="Oscuro (Rosa)" itemValue="luna-pink" />
                            <f:selectItem itemLabel="Oscuro (Ambar)" itemValue="luna-amber" />
                            <p:ajax update="@all" />
                        </p:selectOneMenu>
                    </p:overlayPanel>
                </div>

                <h:outputText value="Sesion iniciada: #{loginUI.usuarioLogeado.nombre}"
                              styleClass="texto-sesion"/>
            </div>

            <p:tabView id="tabsPrincipal">

                <p:tab title="Inventario">
                    <div class="barra-superior">
                        <div class="busqueda">
                            <p:inputText id="busqueda"
                                         value="#{InventarioBean.busqueda}"
                                         placeholder="Ingrese su nombre o ID..."/>

                            <p:commandButton value="Buscar"
                                             action="#{InventarioBean.buscarProducto}"
                                             process="@this busqueda"
                                             update="tablaInventario"
                                             styleClass="ui-button-success" style="margin: 0 5px;"/>

                            <p:commandButton value="Refrescar"
                                             action="#{InventarioBean.refrescar()}"
                                             process="@this"
                                             update="tablaInventario"
                                             styleClass="ui-button-primary"/>
                        </div>
                    </div>

                    <p:dataTable id="tablaInventario"
                                 value="#{InventarioBean.listaInventario}"
                                 var="producto"
                                 selection="#{InventarioBean.seleccionado}"
                                 selectionMode="single"
                                 rowKey="#{producto.idProducto}">

                        <p:ajax event="rowSelect" update="formInventario"/>
                        <p:ajax event="rowUnselect" update="formInventario"/>

                        <p:column headerText="ID">#{producto.idProducto}</p:column>
                        <p:column headerText="Nombre">#{producto.nombreProducto}</p:column>

                        <p:column headerText="Stock">
                            <h:outputText value="#{producto.stock} unidades"/>
                        </p:column>

                        <!-- Usando estilos inline ligeros solo para colores semánticos (verde/naranja) -->
                        <p:column headerText="Entradas">
                            <h:outputText value="#{InventarioBean.obtenerEntradas(producto.idProducto)}"
                                          style="color:#22c55e; font-weight:bold;"/>
                        </p:column>

                        <p:column headerText="Salidas">
                            <h:outputText value="#{InventarioBean.obtenerSalidas(producto.idProducto)}"
                                          style="color:#f59e0b; font-weight:bold;"/>
                        </p:column>

                        <p:column headerText="Precio">
                            <h:outputText value="#{producto.precio}">
                                <f:convertNumber type="currency"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Total Valor">
                            <h:outputText value="#{producto.stock * producto.precio}">
                                <f:convertNumber type="currency"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Proveedor">#{producto.proveedor}</p:column>
                    </p:dataTable>

                    <div style="text-align:center; margin-top:15px;">
                        <p:commandButton value="Eliminar"
                                         action="#{InventarioBean.prepararEliminar()}"
                                         process="@this"
                                         update="formInventario growl"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="ui-button-danger" style="margin-right: 10px;"/>

                        <p:commandButton value="Modificar"
                                         action="#{InventarioBean.prepararModificar}"
                                         process="@this"
                                         update="formInventario growl"
                                         oncomplete="PF('dlgModificar').show()"
                                         disabled="#{empty InventarioBean.seleccionado}"
                                         styleClass="ui-button-success"/>
                    </div>

                    <p:dialog header="Modificar Producto" widgetVar="dlgModificar" modal="true" showEffect="fade" hideEffect="fade" resizable="false">
                        <p:outputPanel id="formModificar">
                            <p:panelGrid columns="2" rendered="#{not empty InventarioBean.productoEdit}" styleClass="ui-noborder">
                                <p:outputLabel value="Nombre del Producto:"/>
                                <p:inputText value="#{InventarioBean.productoEdit.nombreProducto}" required="true" requiredMessage="No deje el campo del nombre vacio"/>

                                <p:outputLabel value="Precio:"/>
                                <p:inputText value="#{InventarioBean.productoEdit.precio}" required="true" requiredMessage="No deje el campo del precio vacio"/>

                                <p:outputLabel value="Stock:"/>
                                <p:inputText value="#{InventarioBean.productoEdit.stock}" disabled="true"/>

                                <p:outputLabel value="Proveedor:"/>
                                <p:selectOneMenu id="proveedorDLG" value="#{InventarioBean.productoEdit.idProveedor}" style="width: 100%;">
                                    <f:selectItem itemLabel="Sin proveedor" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{productoBean.listaProveedores}" var="prov" itemLabel="#{prov.marca} - #{prov.nombre}" itemValue="#{prov.id}"/>
                                </p:selectOneMenu>
                            </p:panelGrid>

                            <div style="text-align: center; margin-top: 15px;">
                                <p:commandButton value="Guardar Cambios" action="#{InventarioBean.modificarProducto}" process="formModificar" update=":formInventario:tabsPrincipal:tablaInventario :formInventario:growl" oncomplete="if (!args.validationFailed) PF('dlgModificar').hide()" styleClass="ui-button-primary"/>
                            </div>
                        </p:outputPanel>
                    </p:dialog>
                </p:tab>

                <p:tab title="Movimientos">
                    <div class="ui-widget-header" style="padding: 12px; margin-bottom: 15px; border-radius: 8px; font-weight: bold;">
                        Gestión de Carga y Descarga de Stock
                    </div>

                    <p:dataTable id="tablaMovimientos" value="#{InventarioBean.listaInventario}" var="p" rows="10" paginator="true" paginatorPosition="bottom">
                        <p:column headerText="Producto">#{p.nombreProducto}</p:column>
                        <p:column headerText="Stock Actual" style="text-align:center;">
                            <h:outputText value="#{p.stock}" style="font-weight:bold;"/>
                        </p:column>
                        <p:column headerText="Cantidad">
                            <p:spinner id="cantOp" value="#{InventarioBean.cantidadOperacion}" min="1" style="width:100%"/>
                        </p:column>
                        <p:column headerText="Acciones" style="text-align:center;">
                            <p:commandButton value="Entrada" icon="pi pi-plus" action="#{InventarioBean.registrarEntrada(p,loginUI.usuarioLogeado)}" process="@this cantOp" update=":formInventario:growl :formInventario:tabsPrincipal:tablaMovimientos :formInventario:tabsPrincipal:tablaInventario" styleClass="ui-button-success" style="margin-right:5px;"/>
                            <p:commandButton value="Salida" icon="pi pi-minus" action="#{InventarioBean.registrarSalida(p,loginUI.usuarioLogeado)}" process="@this cantOp" update=":formInventario:growl :formInventario:tabsPrincipal:tablaMovimientos :formInventario:tabsPrincipal:tablaInventario" styleClass="ui-button-danger"/>
                        </p:column>
                    </p:dataTable>
                </p:tab>

                <p:tab title="Altas">
                    <p:tabView id="tabsAltas" dynamic="true" cache="false">
                        <p:tab title="Usuarios">
                            <p:outputPanel id="panelAltaUsuario" style="padding: 20px; max-width: 500px">
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder">
                                    <p:outputLabel value="Nombre de usuario *"/>
                                    <p:inputText id="nombreUsuario" value="#{usuarioBean.usuario.nombre}" required="true" requiredMessage="Ingrese un nombre"/>
                                    <p:outputLabel value="Constraseña *"/>
                                    <p:password id="passwordUsuario" value="#{usuarioBean.usuario.password}" required="true" requiredMessage="Asegurese de ingresar una contraseña"/>
                                    <p:outputLabel value="Rol del usuario"/>
                                    <p:selectOneMenu id="rolUsuario" value="#{usuarioBean.usuario.rol}" required="true" requiredMessage="Seleccione un rol">
                                        <f:selectItem itemLabel="Seleccionar" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{usuarioBean.roles}" var="rol" itemLabel="#{rol}" itemValue="#{rol}"/>
                                    </p:selectOneMenu>
                                    <p:commandButton value="Registrar" action="#{usuarioBean.registrar}" process="panelAltaUsuario" update=":formInventario:growl :formInventario:tabsPrincipal:tablaUsuarios panelAltaUsuario" styleClass="ui-button-primary" style="margin-top: 15px; width: 150px;"/>
                                </p:panelGrid>
                            </p:outputPanel>
                        </p:tab>

                        <p:tab title="Proveedores">
                            <p:outputPanel id="panelAltaProveedor" style="padding: 20px; max-width: 500px;">
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder">
                                    <p:outputLabel value="Marca del proveedor * "/>
                                    <p:inputText id="marcaProv" value="#{proveedorBean.proveedor.marca}"/>
                                    <p:outputLabel value="Nombre del proveedor *"/>
                                    <p:inputText id="nombreProv" value="#{proveedorBean.proveedor.nombre}" required="true" requiredMessage="Asegurese de ingresar un nombre"/>
                                    <p:outputLabel value="Numero del proveedor *"/>
                                    <p:inputText id="telefonoProv" value="#{proveedorBean.proveedor.contacto}" required="true" requiredMessage="Asegurese de ingresar un numero de celular"/>
                                    <p:commandButton value="Registrar" action="#{proveedorBean.registrar}" process="panelAltaProveedor" update=":formInventario:growl :formInventario:tabsPrincipal:tablaProveedores panelAltaProveedor" styleClass="ui-button-primary" style="margin-top: 15px; width: 150px;"/>
                                </p:panelGrid>
                            </p:outputPanel>
                        </p:tab>

                        <p:tab title="Productos">
                            <p:outputPanel id="panelAltaProducto" style="padding: 20px; max-width: 500px;">
                                <p:panelGrid columns="1" layout="grid" styleClass="ui-noborder">
                                    <p:outputLabel for="nombre" value="Nombre *"/>
                                    <p:inputText id="nombre" value="#{productoBean.producto.nombre}" required="true" requiredMessage="Ingrese un nombre"/>
                                    <p:outputLabel for="precio" value="Precio *"/>
                                    <p:inputText id="precio" value="#{productoBean.producto.precio}" required="true" requiredMessage="Asegurese de ingresar un precio"/>
                                    <p:outputLabel for="proveedor" value="Proveedor *"/>
                                    <p:selectOneMenu id="proveedor" value="#{productoBean.idProveedorSeleccionado}" required="true" requiredMessage="Seleccione un proveedor">
                                        <f:selectItem itemLabel="Seleccionar" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{productoBean.listaProveedores}" var="prov" itemLabel="#{prov.marca} - #{prov.nombre}" itemValue="#{prov.id}"/>
                                    </p:selectOneMenu>
                                    <p:outputLabel for="stock" value="Stock *"/>
                                    <p:inputText id="stock" value="#{productoBean.stockInicial}" required="true" requiredMessage="No deje el Stock vacio"/>
                                    <p:commandButton value="Registrar" action="#{productoBean.registrar(loginUI.usuarioLogeado)}" process="panelAltaProducto" update=":formInventario:growl :formInventario:tabsPrincipal:tablaInventario panelAltaProducto" styleClass="ui-button-primary" style="margin-top: 15px; width: 150px;"/>
                                </p:panelGrid>
                            </p:outputPanel>
                        </p:tab>
                    </p:tabView>
                </p:tab>

                <p:tab title="Proveedores">
                    <div class="controls-container barra-superior">
                        <div class="busqueda">
                            <p:inputText id="busquedaProveedor" value="#{proveedorBean.busqueda}" placeholder="Ingrese nombre o ID..."/>
                            <p:commandButton value="Buscar" action="#{proveedorBean.buscarProveedor}" process="@this busquedaProveedor" update="tablaProveedores" styleClass="ui-button-success" style="margin: 0 5px;"/>
                            <p:commandButton value="Refrescar" action="#{proveedorBean.cargarProveedores()}" process="@this cargarProveedores" update="tablaProveedores" styleClass="ui-button-primary"/>
                        </div>
                    </div>

                    <p:dataTable id="tablaProveedores" value="#{proveedorBean.listaProveedores}" var="prov" selection="#{proveedorBean.proveedorSeleccionado}" selectionMode="single" rowKey="#{prov.id}" emptyMessage="No se encontraron proveedores" style="margin-top:20px;">
                        <p:ajax event="rowSelect" update=":formInventario:tabsPrincipal:botonesProveedores"/>
                        <p:ajax event="rowUnselect" update=":formInventario:tabsPrincipal:botonesProveedores"/>

                        <p:column headerText="ID Proveedor"><h:outputText value="#{prov.id}"/></p:column>
                        <p:column headerText="Marca"><h:outputText value="#{prov.marca}"/></p:column>
                        <p:column headerText="Nombre"><h:outputText value="#{prov.nombre}"/></p:column>
                        <p:column headerText="Contacto"><h:outputText value="#{prov.contacto}"/></p:column>
                    </p:dataTable>

                    <h:panelGroup id="botonesProveedores" layout="block" style="text-align: center; margin-top: 15px;">
                        <p:commandButton value="Eliminar" action="#{proveedorBean.eliminarProveedor(proveedorBean.proveedorSeleccionado)}" process="@this" update=":formInventario:tabsPrincipal:tablaProveedores :formInventario:growl botonesProveedores" disabled="#{empty proveedorBean.proveedorSeleccionado}" styleClass="ui-button-danger" style="margin-right: 10px;">
                            <p:confirm header="Confirmación" message="¿Estás seguro de que deseas eliminar permanentemente a este proveedor? Esta acción es irreversible." icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                        <p:commandButton value="Modificar" action="#{proveedorBean.prepararModificacion(proveedorBean.proveedorSeleccionado)}" process="@this" update=":formInventario:tabsPrincipal:panelModificarProv" oncomplete="PF('dlgModProv').show()" disabled="#{empty proveedorBean.proveedorSeleccionado}" styleClass="ui-button-success"/>
                    </h:panelGroup>

                    <p:dialog header="Modificar Proveedor" widgetVar="dlgModProv" modal="true" showEffect="fade" hideEffect="fade" resizable="false">
                        <p:outputPanel id="panelModificarProv">
                            <p:panelGrid columns="2" rendered="#{not empty proveedorBean.proveedorSeleccionado}" styleClass="ui-noborder">
                                <p:outputLabel value="Nombre:"/>
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.nombre}" required="true" requiredMessage="No deje el campo de nombre vacio"/>
                                <p:outputLabel value="Marca del proveedor"/>
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.marca}" required="true" requiredMessage="No deje espacios vacios"/>
                                <p:outputLabel value="Contacto:"/>
                                <p:inputText value="#{proveedorBean.proveedorSeleccionado.contacto}" required="true" requiredMessage="No deje el campo del numero telefonico vacio"/>
                            </p:panelGrid>
                            <div style="text-align: center; margin-top: 15px;">
                                <p:commandButton value="Guardar Cambios" action="#{proveedorBean.guardarModificacion}" process="panelModificarProv" update=":formInventario:tabsPrincipal:tablaProveedores :formInventario:growl" oncomplete="if (!args.validationFailed) PF('dlgModProv').hide()" styleClass="ui-button-primary"/>
                            </div>
                        </p:outputPanel>
                    </p:dialog>
                </p:tab>

                <p:tab title="Usuarios">
                    <div id="zonaBusqueda" style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; justify-content: center;">
                        <p:commandButton value="Refrescar" action="#{usuarioBean.cargarUsuarios}" process="@this" update=":formInventario:tabsPrincipal:tablaUsuarios txtBusqueda" styleClass="ui-button-primary"/>
                        <p:inputText id="txtBusqueda" value="#{usuarioBean.busqueda}" placeholder="Ingresa el nombre o el id" style="width: 300px;"/>
                        <p:commandButton value="Buscar" action="#{usuarioBean.buscarUsuario}" process="txtBusqueda @this" update=":formInventario:tabsPrincipal:tablaUsuarios" styleClass="ui-button-success"/>
                    </div>

                    <p:dataTable id="tablaUsuarios" value="#{usuarioBean.listaUsuarios}" var="user" emptyMessage="No se encontraron usuarios" style="margin-top:20px;" selection="#{usuarioBean.usuarioSeleccionado}" selectionMode="single" rowKey="#{user.id}">
                        <p:ajax event="rowSelect" update=":formInventario:tabsPrincipal:botonesUsuarios"/>
                        <p:ajax event="rowUnselect" update=":formInventario:tabsPrincipal:botonesUsuarios"/>

                        <p:column headerText="ID Usuario"><h:outputText value="#{user.id}"/></p:column>
                        <p:column headerText="Nombre"><h:outputText value="#{user.nombre}"/></p:column>
                        <p:column headerText="Contraseña"><h:outputText value="*********"/></p:column>
                        <p:column headerText="Rol de usuario"><h:outputText value="#{user.rol}"/></p:column>
                    </p:dataTable>

                    <h:panelGroup id="botonesUsuarios" layout="block" style="text-align: center; margin-top: 15px;">
                        <p:commandButton value="Eliminar" action="#{usuarioBean.eliminarUsuario(usuarioBean.usuarioSeleccionado)}" process="@this" update=":formInventario:tabsPrincipal:tablaUsuarios :formInventario:growl botonesUsuarios" disabled="#{empty usuarioBean.usuarioSeleccionado}" styleClass="ui-button-danger" style="margin-right: 10px;">
                            <p:confirm header="Confirmación" message="¿Estás seguro de que deseas eliminar permanentemente a este usuario? Esta acción es irreversible" icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                        <p:commandButton value="Modificar" action="#{usuarioBean.prepararModificacion(usuarioBean.usuarioSeleccionado)}" process="@this" update=":formInventario:tabsPrincipal:panelModificarUser" oncomplete="PF('dlgModUser').show()" disabled="#{empty usuarioBean.usuarioSeleccionado}" styleClass="ui-button-success"/>
                    </h:panelGroup>

                    <p:dialog header="Modificar Usuario" widgetVar="dlgModUser" modal="true" showEffect="fade" hideEffect="fade" resizable="false">
                        <p:outputPanel id="panelModificarUser">
                            <p:panelGrid columns="2" rendered="#{not empty usuarioBean.usuarioSeleccionado}" styleClass="ui-noborder">
                                <p:outputLabel value="Nombre:"/>
                                <p:inputText value="#{usuarioBean.usuarioSeleccionado.nombre}" required="true" requiredMessage="No deje el campo de nombre vacío"/>
                                <p:outputLabel value="Contraseña:"/>
                                <p:inputText value="#{usuarioBean.usuarioSeleccionado.password}" required="true" requiredMessage="No deje la contraseña vacía"/>
                                <p:outputLabel value="Rol:"/>
                                <p:selectOneMenu value="#{usuarioBean.usuarioSeleccionado.rol}">
                                    <f:selectItems value="#{usuarioBean.roles}"/>
                                </p:selectOneMenu>
                            </p:panelGrid>
                            <div style="text-align: center; margin-top: 15px;">
                                <p:commandButton value="Guardar Cambios" action="#{usuarioBean.guardarModificacion}" process="panelModificarUser" update=":formInventario:tabsPrincipal:tablaUsuarios :formInventario:growl" oncomplete="if (!args.validationFailed) PF('dlgModUser').hide()" styleClass="ui-button-primary"/>
                            </div>
                        </p:outputPanel>
                    </p:dialog>
                </p:tab>

                <p:tab title="Historial de movimientos" rendered="#{AuditoriaBean.puedeVerAuditoria(loginUI.usuarioLogeado)}">

                    <div class="ui-widget-header" style="padding: 12px; margin-bottom: 15px; border-radius: 8px; font-weight: bold;">
                        Historial de Movimientos y Reporte Mensual
                    </div>

                    <!-- Sustituyendo el fondo #f8fbff por ui-widget-content para adaptabilidad -->
                    <p:outputPanel id="cajaFiltros" layout="block" styleClass="ui-widget-content" style="display: flex; flex-direction: row; justify-content: flex-start; align-items: flex-end; gap: 20px; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--surface-d); width: 100%;">
                        <h:panelGroup layout="block">
                            <h:outputText value="Filtrar por Usuario:" style="font-weight:bold; display:block; margin-bottom:5px;"/>
                            <p:selectOneMenu id="usuarioFiltro" value="#{AuditoriaBean.idUsuarioFiltro}" style="min-width: 180px;">
                                <f:selectItem itemLabel="Todos los usuarios" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{AuditoriaBean.listaUsuarios}" var="usr" itemLabel="#{usr.nombre}" itemValue="#{usr.id}"/>
                            </p:selectOneMenu>
                        </h:panelGroup>

                        <h:panelGroup layout="block">
                            <h:outputText value="Desde:" style="font-weight:bold; display:block; margin-bottom:5px;"/>
                            <p:datePicker id="fechaDesde" value="#{AuditoriaBean.fechaInicio}" pattern="dd/MM/yyyy" showIcon="true" placeholder="Fecha inicio" />
                        </h:panelGroup>

                        <h:panelGroup layout="block">
                            <h:outputText value="Hasta:" style="font-weight:bold; display:block; margin-bottom:5px;"/>
                            <p:datePicker id="fechaHasta" value="#{AuditoriaBean.fechaFin}" pattern="dd/MM/yyyy" showIcon="true" placeholder="Fecha fin" />
                        </h:panelGroup>

                        <h:panelGroup layout="block" style="display: flex; gap: 10px;">
                            <p:commandButton value="Filtrar" action="#{AuditoriaBean.aplicarFiltros}" process="@this usuarioFiltro fechaDesde fechaHasta" update="areaResultados msgFiltros" styleClass="ui-button-success" icon="pi pi-filter" />
                            <p:commandButton value="Limpiar Filtros" action="#{AuditoriaBean.limpiarFiltros}" process="@this" update=":formInventario:tabsPrincipal:cajaFiltros :formInventario:tabsPrincipal:areaResultados" styleClass="ui-button-primary" icon="pi pi-filter-slash" />
                        </h:panelGroup>
                    </p:outputPanel>

                    <h:panelGroup id="areaResultados" layout="block">
                        <h:panelGrid columns="3" id="panelTotales" styleClass="ui-widget-content" style="margin-bottom:15px; padding:15px; border-radius:8px; width:100%;">
                            <h:panelGroup>
                                <h:outputText value="TOTAL ENTRADAS: " style="font-weight:bold; display:block;"/>
                                <h:outputText value="#{AuditoriaBean.totalEntradas} unidades" style="color:#22c55e; font-weight:bold; font-size:1.2em;"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <h:outputText value="TOTAL SALIDAS: " style="font-weight:bold; display:block;"/>
                                <h:outputText value="#{AuditoriaBean.totalSalidas} unidades" style="color:#f59e0b; font-weight:bold; font-size:1.2em;"/>
                            </h:panelGroup>
                            <p:commandButton value="Actualizar Reporte" action="#{AuditoriaBean.cargarTodosLosMovimientos()}" process="@this" update="areaResultados" icon="pi pi-refresh" styleClass="ui-button-primary"/>
                        </h:panelGrid>

                        <p:dataTable id="tablaAuditoria" value="#{AuditoriaBean.listaFiltrada}" var="mov" emptyMessage="No hay movimientos registrados" rows="10" paginator="true" paginatorPosition="bottom" allowUnsorting="true" sortMode="single" style="margin-top:10px;">
                            <p:column headerText="Fecha" style="width:150px; text-align:center;" sortBy="#{mov.fecha}" sortOrder="descending">
                                <h:outputText value="#{mov.fecha}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/Tijuana"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Usuario" style="text-align:center;" sortBy="#{mov.usuario.nombre}">
                                <h:outputText value="#{mov.usuario != null ? mov.usuario.nombre : 'Sistema'}"/>
                            </p:column>
                            <p:column headerText="Producto" sortBy="#{mov.producto.nombre}">
                                <h:outputText value="#{mov.producto != null ? mov.producto.nombre : 'N/A'}"/>
                            </p:column>
                            <p:column headerText="Tipo" style="text-align:center;" sortBy="#{mov.tipo}">
                                <h:outputText value="#{mov.tipo}" style="font-weight:bold; text-transform: uppercase; color: #{mov.tipo == 'entrada' ? '#22c55e' : '#f59e0b'}"/>
                            </p:column>
                            <p:column headerText="Cantidad" style="text-align:center;" sortBy="#{mov.cantidad}">
                                <h:outputText value="#{mov.cantidad}"/>
                            </p:column>
                        </p:dataTable>
                    </h:panelGroup>
                </p:tab>

            </p:tabView>
        </h:form>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350" appendTo="@(body)">
            <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
            <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes"/>
        </p:confirmDialog>
    </div>

    <p:confirmDialog widgetVar="confirmDialog" appendTo="@(body)">
        <h:outputText value="Quieres eliminar este producto? Esta accion es irreversible" title="Confirmacion"/>
        <p:commandButton value="Sí" action="#{InventarioBean.eliminarProducto}" process="@this" update=":formInventario:tablaInventario :formInventario:growl" oncomplete="PF('confirmDialog').hide()"/>
        <p:commandButton value="No" type="button" onclick="PF('confirmDialog').hide();"/>
    </p:confirmDialog>

</h:body>
</html>
